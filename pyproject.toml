[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-achievements"
version = "1.3.11"
description = "Local-first, self-hostable achievement library for every game, including the ones no platform tracks."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "Greycell Open" }]
# The core (profile, events, CLI, imports, sync client) needs nothing outside
# the standard library. The server and the local web UI are extras.
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pytest>=8"]

[project.scripts]
openachievements = "openachievements.cli:main"
greycell-achievements = "openachievements.cli:main"
openachievements-server = "openachievements.server.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openachievements = ["web/*", "saverules/*.json", "fonts/*", "audio/*.wav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
